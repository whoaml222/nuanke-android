name: Signed release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          NUANKE_KEYSTORE_BASE64: ${{ secrets.NUANKE_KEYSTORE_BASE64 }}
        run: echo "$NUANKE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nuanke-release.jks"
      - name: Verify and build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nuanke-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NUANKE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.NUANKE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.NUANKE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "nuanke-${GITHUB_REF_NAME}.apk"
          sha256sum "nuanke-${GITHUB_REF_NAME}.apk" > "nuanke-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "nuanke-${GITHUB_REF_NAME}.apk"
          "nuanke-${GITHUB_REF_NAME}.apk.sha256"
          --verify-tag
          --generate-notes
